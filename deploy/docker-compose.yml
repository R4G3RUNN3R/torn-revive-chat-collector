services:
  reviverelay-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REVIVERELAY_DB_NAME:-reviverelay}
      POSTGRES_USER: ${REVIVERELAY_DB_USER:-reviverelay_app}
      POSTGRES_PASSWORD: ${REVIVERELAY_DB_PASSWORD}
    volumes:
      - ${REVIVERELAY_DATA_DIR:-/srv/voidsmith/torn-platform/reviverelay/data/postgres}:/var/lib/postgresql/data
    networks:
      - reviverelay_db_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REVIVERELAY_DB_USER:-reviverelay_app} -d ${REVIVERELAY_DB_NAME:-reviverelay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  reviverelay-api:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app/server
    command: ["node", "src/server.js"]
    env_file:
      - ${REVIVERELAY_ENV_FILE:-/srv/voidsmith/shared/secrets/reviverelay/runtime.env}
    environment:
      PORT: 3100
      DATABASE_URL: postgres://${REVIVERELAY_DB_USER:-reviverelay_app}:${REVIVERELAY_DB_PASSWORD}@reviverelay-db:5432/${REVIVERELAY_DB_NAME:-reviverelay}
      REVIVERELAY_RELEASE_MANIFEST_FILE: /releases/client/manifest.json
    volumes:
      - ${REVIVERELAY_APP_DIR:-/srv/voidsmith/torn-platform/reviverelay/app}:/app:ro
      - ${REVIVERELAY_CLIENT_RELEASE_DIR:-/srv/voidsmith/torn-platform/reviverelay/releases/client}:/releases/client:ro
    ports:
      - "127.0.0.1:18730:3100"
    depends_on:
      reviverelay-db:
        condition: service_healthy
    networks:
      - reviverelay_db_internal
      - reviverelay_egress

  reviverelay-worker:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app/server
    command: ["node", "src/worker.js"]
    env_file:
      - ${REVIVERELAY_ENV_FILE:-/srv/voidsmith/shared/secrets/reviverelay/runtime.env}
    environment:
      DATABASE_URL: postgres://${REVIVERELAY_DB_USER:-reviverelay_app}:${REVIVERELAY_DB_PASSWORD}@reviverelay-db:5432/${REVIVERELAY_DB_NAME:-reviverelay}
      REVIVERELAY_GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/reviverelay/google-service-account.json
      REVIVERELAY_ERROR_SHEET_ID: ${REVIVERELAY_ERROR_SHEET_ID:-1HnaW1_PADiDwm6G-22o4TOxkrkgLbhQgzWzoEDd29dY}
      REVIVERELAY_ERROR_SHEET_TAB: ${REVIVERELAY_ERROR_SHEET_TAB:-ReviveRelay Issues}
    volumes:
      - ${REVIVERELAY_APP_DIR:-/srv/voidsmith/torn-platform/reviverelay/app}:/app:ro
      - ${REVIVERELAY_SECRET_DIR:-/srv/voidsmith/shared/secrets/reviverelay}:/run/secrets/reviverelay:ro
    depends_on:
      reviverelay-db:
        condition: service_healthy
    networks:
      - reviverelay_db_internal
      - reviverelay_egress

networks:
  reviverelay_db_internal:
    name: reviverelay_db_internal
    internal: true
  reviverelay_egress:
    name: reviverelay_egress
