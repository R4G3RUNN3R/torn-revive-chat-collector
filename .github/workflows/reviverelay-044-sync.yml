name: ReviveRelay 0.4.4 exact tree sync

on:
  push:
    branches:
      - sync/reviverelay-0.4.4-exact-tree

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/reviverelay-0.4.4-exact-tree
          fetch-depth: 0

      - name: Replace branch tree with verified VPS archive
        shell: bash
        run: |
          set -euo pipefail
          URL='https://reviverelay.voidsmithindustries.com/internal-sync/reviverelay-0.4.4-sync-0dda77b.tar.gz'
          EXPECTED_SHA='ef1b5df34fadb9b5f1be507d42c13eb50c5be401255cc6cdabb854fb752dac87'
          EXPECTED_TREE='6e1dd8eedf086f8c868c60df710cb86392d83718'
          curl --fail --location --retry 3 "$URL" -o /tmp/reviverelay-0.4.4.tar.gz
          echo "$EXPECTED_SHA  /tmp/reviverelay-0.4.4.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/reviverelay-0.4.4.tar.gz -C .
          git add -A
          ACTUAL_TREE=$(git write-tree)
          echo "Expected tree: $EXPECTED_TREE"
          echo "Actual tree:   $ACTUAL_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bundle ReviveRelay client dependencies'
          git push origin HEAD:sync/reviverelay-0.4.4-exact-tree
