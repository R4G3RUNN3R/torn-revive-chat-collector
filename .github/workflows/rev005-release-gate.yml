name: ReviveRelay 0.7.2 release gate

on:
  push:
    branches:
      - fix/rev-005-one-click-updater

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rev005-test-only
          POSTGRES_DB: reviverelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reviverelay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:rev005-test-only@127.0.0.1:5432/reviverelay_test
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Show candidate identity
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          git status --short

      - name: Install server dependencies
        run: npm --prefix server install --ignore-scripts --no-audit --no-fund

      - name: Build review artifact
        run: npm run build

      - name: Client regression suite
        run: npm run test:client:raw

      - name: Server and database suite
        run: npm run test:server

      - name: Syntax and release smoke
        run: |
          node --check dist/review/ReviveRelay-0.7.2.user.js
          node --test test/review-release-smoke.test.js test/release-dependency-verification.test.js

      - name: Static review audit
        run: npm run audit:review

      - name: Candidate artifact identity
        run: |
          sha256sum dist/review/ReviveRelay-0.7.2.user.js
          wc -c dist/review/ReviveRelay-0.7.2.user.js
          grep -m1 '^// @version' dist/review/ReviveRelay-0.7.2.user.js
          grep -m1 '^// ReviveRelay-Build-Commit:' dist/review/ReviveRelay-0.7.2.user.js
          grep -m1 '^// ReviveRelay-Build-Timestamp:' dist/review/ReviveRelay-0.7.2.user.js
