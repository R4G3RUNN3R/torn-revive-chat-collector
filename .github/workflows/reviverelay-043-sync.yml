name: ReviveRelay 0.4.3 exact tree sync

on:
  push:
    branches:
      - sync/reviverelay-0.4.3-exact-tree
    paths:
      - .github/workflows/reviverelay-043-sync.yml

permissions:
  contents: write

jobs:
  import-exact-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch verified VPS archive and prove exact tree
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://reviverelay.voidsmithindustries.com/sync-043/reviverelay-0.4.3-sync-26ee3a4.tar.gz \
            --output /tmp/reviverelay-043.tar.gz
          echo 'fda19c37779b146d78caf2179cd437fe8c4accc81e9f798108fffaaeb50b848e  /tmp/reviverelay-043.tar.gz' | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/reviverelay-043.tar.gz -C .
          git add -A
          test "$(git write-tree)" = '472013c5fa9008a07c8dbbc317a1f0e0e1f69c84'
      - name: Commit exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && { echo 'No change to commit'; exit 1; }
          git commit -m 'fix: relay shared public revive candidates'
          test "$(git rev-parse HEAD^{tree})" = '472013c5fa9008a07c8dbbc317a1f0e0e1f69c84'
          git push origin HEAD:${GITHUB_REF_NAME}
