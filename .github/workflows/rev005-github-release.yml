name: Publish ReviveRelay 0.7.2 GitHub prerelease

on:
  push:
    branches:
      - fix/rev-005-one-click-updater
    paths:
      - .github/workflows/rev005-github-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified release record
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Build and verify immutable candidate
        run: |
          npm run build
          node scripts/verify-review-artifact.js
          node --check dist/review/ReviveRelay-0.7.2.user.js
          npm run audit:review
          echo "43bd6278630e970e6113edf6638bae003fc159a82d310295669d0cef637dd29c  dist/review/ReviveRelay-0.7.2.user.js" | sha256sum -c -

      - name: Build public installer metadata wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          src_path=Path('dist/review/ReviveRelay-0.7.2.user.js')
          src=src_path.read_text()
          marker='// ==/UserScript=='
          cut=src.index(marker)+len(marker)
          header=src[:cut]
          body=src[cut:]
          icon='// @icon         data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2311170d%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2218%22%20width%3D%2242%22%20height%3D%2234%22%20rx%3D%227%22%20fill%3D%22%23f3f7ee%22%2F%3E%3Cpath%20d%3D%22M24%2018v-3c0-3%202-5%205-5h6c3%200%205%202%205%205v3%22%20fill%3D%22none%22%20stroke%3D%22%23d9ff52%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M28%2025h8v7h7v8h-7v7h-8v-7h-7v-8h7z%22%20fill%3D%22%23d9ff52%22%2F%3E%3C%2Fsvg%3E'
          out=[]
          for line in header.splitlines():
              if line.startswith('// @updateURL'):
                  out += [
                      icon,
                      '// @supportURL   https://voidsmithindustries.com/torn/support.html',
                      '// @updateURL    https://voidsmithindustries.com/torn/install/reviverelay.user.js'
                  ]
              elif line.startswith('// @downloadURL'):
                  out.append('// @downloadURL  https://voidsmithindustries.com/torn/install/reviverelay.user.js')
              else:
                  out.append(line)
          public_header='\n'.join(out)
          public_user=public_header+body
          Path('ReviveRelay-0.7.2-public.user.js').write_text(public_user)
          Path('ReviveRelay-0.7.2-public.meta.js').write_text(public_header+'\n')

          def executable_body(path):
              b=Path(path).read_bytes()
              m=b'// ==/UserScript=='
              return b[b.index(m)+len(m):]

          assert executable_body(src_path) == executable_body('ReviveRelay-0.7.2-public.user.js')
          assert hashlib.sha256(src_path.read_bytes()).hexdigest() == '43bd6278630e970e6113edf6638bae003fc159a82d310295669d0cef637dd29c'

          manifest={
            'latestVersion':'0.7.2',
            'minimumVersion':'0.6.1',
            'buildTimestamp':'2026-09-21T08:15:00.000Z',
            'releaseNotes':'ReviveRelay 0.7.2 adds one-click safe update handoff through the canonical Voidsmith installer while keeping background checks notification-only.',
            'gitCommit':'e361e8d2aa1cea2599c2e4dd15d06f5efa1ad195',
            'releaseChannel':'review',
            'sha256':'43bd6278630e970e6113edf6638bae003fc159a82d310295669d0cef637dd29c',
            'apiCompatibility':{'minimum':1,'current':1},
            'install':{
              'installUrl':'https://reviverelay.voidsmithindustries.com/releases/review/0.7.2/ReviveRelay-0.7.2.user.js',
              'metaUrl':'https://reviverelay.voidsmithindustries.com/releases/review/0.7.2/ReviveRelay-0.7.2.meta.js'
            },
            'mandatory':False
          }
          Path('ReviveRelay-0.7.2-release-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('PUBLIC_WRAPPER_SHA256='+hashlib.sha256(Path('ReviveRelay-0.7.2-public.user.js').read_bytes()).hexdigest())
          print('PUBLIC_WRAPPER_SIZE='+str(Path('ReviveRelay-0.7.2-public.user.js').stat().st_size))
          PY
          sha256sum ReviveRelay-0.7.2-public.user.js ReviveRelay-0.7.2-public.meta.js
          wc -c ReviveRelay-0.7.2-public.user.js ReviveRelay-0.7.2-public.meta.js

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create reviverelay-v0.7.2-beta \
            --repo "${GITHUB_REPOSITORY}" \
            --target 999208663fac2238e10411cb2e8f5749ef094aa3 \
            --title "ReviveRelay 0.7.2 Public Beta" \
            --prerelease \
            --notes "Public Beta/Review release. Adds a one-click safe update handoff from ReviveRelay to the canonical Voidsmith installer. Background checks remain notification-only. No remote eval or self-modification. Stable remains 0.4.4 and genuine TornPDA device acceptance is still pending." \
            dist/review/ReviveRelay-0.7.2.user.js \
            dist/review/ReviveRelay-0.7.2.meta.js \
            ReviveRelay-0.7.2-public.user.js \
            ReviveRelay-0.7.2-public.meta.js \
            ReviveRelay-0.7.2-release-manifest.json
