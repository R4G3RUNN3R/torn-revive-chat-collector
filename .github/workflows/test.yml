name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix server install --no-audit --no-fund
      - run: npm test
      - run: node --check torn-revive-chat-collector.user.js
      - run: node --check src/core.js
      - run: node --check src/chat-dom.js
