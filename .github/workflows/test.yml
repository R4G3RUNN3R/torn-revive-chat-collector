name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reviverelay
          POSTGRES_PASSWORD: test
          POSTGRES_DB: reviverelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviverelay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://reviverelay:test@127.0.0.1:5432/reviverelay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix server --no-audit --no-fund
      - run: npm test
      - run: node --check torn-revive-chat-collector.user.js
      - run: node --check src/core.js
      - run: node --check src/chat-dom.js
      - run: node --check server/src/config.js
