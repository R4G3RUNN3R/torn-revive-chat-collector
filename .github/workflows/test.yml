name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reviverelay
          POSTGRES_PASSWORD: test
          POSTGRES_DB: reviverelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviverelay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://reviverelay:test@127.0.0.1:5432/reviverelay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix server --no-audit --no-fund
      - name: Full client and server test suite
        run: npm test
      - name: Explicit server PostgreSQL suite
        run: npm --prefix server test
      - name: Build installable userscript
        run: npm run build
      - name: Syntax check userscript sources and build
        run: |
          node --check torn-revive-chat-collector.user.js
          node --check dist/torn-revive-chat-collector.user.js
          node --check src/core.js
          node --check src/chat-dom.js
          node --check src/public-channels.js
      - name: Syntax check ReviveRelay server entrypoints
        run: |
          node --check server/src/config.js
          node --check server/src/app.js
          node --check server/src/server.js
          node --check server/src/worker.js
          node --check server/src/db/migrate.js
          node --check server/src/db/jobs.js
          node --check server/src/db/transactions.js
      - name: Syntax check deployment scripts
        run: |
          sh -n deploy/backup.sh
          sh -n deploy/restore.sh
